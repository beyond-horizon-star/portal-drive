name: Build APK

on:
  push:
    paths:
      - "game.zip"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          rm -rf project
          mkdir project
          unzip -q game.zip -d project
          SCRIPT="$(find project -path '*ci/build.sh' | head -n1)"
          bash "$SCRIPT"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PortalDrive-apk
          path: out/PortalDrive.apk
          if-no-files-found: ignore
          
